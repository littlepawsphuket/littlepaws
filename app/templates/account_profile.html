{% extends 'base.html' %}
{% from '_icons.html' import app_icon %}
{% block page_heading %}
<h1>{{ _('แก้ไขโปรไฟล์') }}</h1>
{% endblock %}
{% block content %}
<section class="card login account-profile">
  
  <div class="account-avatar profile-photo">
    {% if g.user.has_photo %}<img src="{{url_for('auth.photo')}}" alt="{{ _('รูปโปรไฟล์') }}" width="84" height="84">
    {% else %}{{app_icon('user')}}{% endif %}
  </div>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <label>{{ _('ชื่อที่แสดง') }}<input name="display_name" value="{{display_name}}" maxlength="80" required></label>
    <label>{{ _('รูปโปรไฟล์') }}<input type="file" name="photo" accept="image/jpeg,image/png,image/webp,image/heic,image/heif"></label>
    {% if g.user.has_photo %}<label class="profile-remove"><input type="checkbox" name="remove_photo" value="1"> {{ _('นำรูปออก') }}</label>{% endif %}
    <div class="actions"><button>{{ _('บันทึก') }}</button><a class="button secondary" href="{{url_for('dashboard')}}">{{ _('ยกเลิก') }}</a></div>
  </form>
</section>
{% endblock %}
