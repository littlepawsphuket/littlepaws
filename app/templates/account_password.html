{% extends 'base.html' %}
{% block page_heading %}
<h1>{{ _('เปลี่ยนรหัสผ่าน') }}</h1>
{% endblock %}
{% block content %}
<section class="card login">
  
  {% if g.user.needs_password %}<p>{{ _('กรุณาเปลี่ยนรหัสผ่านก่อนเริ่มใช้งาน') }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{csrf}}">
    <label>{{ _('รหัสผ่านเดิม') }}<input name="current_password" type="password" autocomplete="current-password" maxlength="128" required autofocus></label>
    <label>{{ _('รหัสผ่านใหม่') }}<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <label>{{ _('ยืนยันรหัสผ่านใหม่') }}<input name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
    <button>{{ _('เปลี่ยนรหัสผ่าน') }}</button>
  </form>
</section>
{% endblock %}
