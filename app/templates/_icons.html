{% macro app_icon(name) %}
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'add' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'edit' %}<path d="m15 5 4 4M4 20l1-5L16.6 3.4a1.4 1.4 0 0 1 2 0l2 2a1.4 1.4 0 0 1 0 2L9 19l-5 1Z"/>
  {% elif name == 'checkin' %}<path d="M13 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6M3 12h12m-5-5 5 5-5 5"/>
  {% elif name == 'checkout' %}<path d="M11 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h6M9 12h12m-5-5 5 5-5 5"/>
  {% elif name == 'warning' %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/>
  {% elif name == 'delete' %}<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/>
  {% elif name == 'user' %}<circle cx="12" cy="8" r="3.5"/><path d="M5 20v-1a7 7 0 0 1 14 0v1"/>
  {% elif name == 'details' %}<path d="M7 3h7l4 4v14H6V3h1Zm7 0v5h4M9 12h6m-6 4h6"/>
  {% elif name == 'stay' %}<path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/>
  {% elif name == 'print' %}<path d="M7 8V3h10v5M7 17H4V8h16v9h-3M7 14h10v7H7zm10-3h.01"/>
  {% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/>
  {% elif name == 'settings' %}<path d="m10 3-.6 2.3-1.8 1-2.3-.6-2 3.5L5 11v2l-1.7 1.8 2 3.5 2.3-.6 1.8 1L10 21h4l.6-2.3 1.8-1 2.3.6 2-3.5L19 13v-2l1.7-1.8-2-3.5-2.3.6-1.8-1L14 3Z"/><circle cx="12" cy="12" r="3"/>
  {% elif name == 'camera' %}<path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="3.5"/><path d="M18.5 10h.01"/>
  {% elif name == 'image' %}<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 16-5-5-8 9"/>
  {% elif name == 'globe' %}<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
  {% elif name == 'pdf' %}<path d="M6 3h8l4 4v14H6zM14 3v5h4M12 10v6m-3-3 3 3 3-3"/>
  {% elif name == 'dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
  {% elif name == 'previous' %}<path d="m15 5-7 7 7 7"/>
  {% elif name == 'next' %}<path d="m9 5 7 7-7 7"/>
  {% endif %}
</svg>
{% endmacro %}
