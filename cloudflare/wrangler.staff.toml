name = "little-paws-staff"
main = "staff.mjs"
compatibility_date = "2026-11-17"
workers_dev = false
preview_urls = false
# Browser functions are sent to the page as source. Omit Worker-only name helpers.
keep_names = false

[vars]
ACCESS_AUDIENCE = ""
TIMELINE_ORIGIN = ""

[browser]
binding = "BROWSER"

[[d1_databases]]
binding = "DB"
database_name = "little-paws-staging"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "little-paws-staging-media"
